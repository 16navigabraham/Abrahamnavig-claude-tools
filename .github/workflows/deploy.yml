name: Deploy

# Every push to main is tested, then deployed to the Oracle Cloud VM over SSH.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ORACLE_HOST         the VM's public IP or hostname
#   ORACLE_USER         the SSH user, e.g. ubuntu
#   ORACLE_SSH_KEY      a private key whose public half is in the VM's ~/.ssh/authorized_keys
#   ORACLE_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <ORACLE_HOST>`, so the VM is verified
# Optional repository variable:
#   ORACLE_APP_DIR      where the repo is cloned on the VM (default: ~/Abrahamnavig-claude-tools)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-build.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set the ORACLE_SSH_KEY and ORACLE_KNOWN_HOSTS secrets (see the comment at the top of deploy.yml)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          APP_DIR: ${{ vars.ORACLE_APP_DIR || '~/Abrahamnavig-claude-tools' }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" \
            "set -e; cd $APP_DIR && git fetch --quiet origin main && git reset --quiet --hard && git checkout --quiet -B main $SHA && bash deploy/update.sh"
